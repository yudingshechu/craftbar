<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CraftBar – app demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EAD2; --bg2:#E7DBB9; --surface:#FBF7E9; --surface2:#F5EDD6;
  --ink:#3A2A1D; --ink2:#6B5744; --line:rgba(58,42,29,.16);
  --green:#5B6F33; --green-d:#44541F; --on-green:#FAF6E4; --green-t:rgba(91,111,51,.16);
  --kraft:#C9A474; --kraft-t:rgba(201,164,116,.30); --almond-t:rgba(169,116,74,.20);
  --apple:#B5453A; --cream:#D8BE8A;
  --shadow:0 1px 0 rgba(58,42,29,.06), 0 10px 24px -14px rgba(58,42,29,.35);
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1812; --bg2:#15110C; --surface:#2C241B; --surface2:#251E16;
    --ink:#F2E9D2; --ink2:#C4B393; --line:rgba(242,233,210,.16);
    --green:#A9BF6E; --green-d:#C3D68C; --on-green:#1B2210; --green-t:rgba(169,191,110,.18);
    --kraft:#9C7B52; --kraft-t:rgba(156,123,82,.28); --almond-t:rgba(201,150,100,.20);
    --apple:#E0786C; --cream:#B89E66;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1812; --bg2:#15110C; --surface:#2C241B; --surface2:#251E16;
  --ink:#F2E9D2; --ink2:#C4B393; --line:rgba(242,233,210,.16);
  --green:#A9BF6E; --green-d:#C3D68C; --on-green:#1B2210; --green-t:rgba(169,191,110,.18);
  --kraft:#9C7B52; --kraft-t:rgba(156,123,82,.28); --almond-t:rgba(201,150,100,.20);
  --apple:#E0786C; --cream:#B89E66;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

/* seasonal tint: same layout and ink, only the background, surfaces and accent drift a little.
   autumn = base palette (olive + kraft, apple dot); the others shift toward a seasonal food. */
:root{ --season-dot:var(--apple); }
/* spring: pea shoots, matcha, strawberry */
:root[data-season="spring"]{
  --bg:#ECEBD0; --bg2:#DEE0BC; --surface:#F9F9EA; --surface2:#F0F0D9;
  --green:#4F7535; --green-d:#3A5A24; --green-t:rgba(79,117,53,.16);
  --kraft-t:rgba(168,190,120,.28); --season-dot:#D2505A;
}
/* summer: apricot, pistachio */
:root[data-season="summer"]{
  --bg:#F5E7CC; --bg2:#EDD6AE; --surface:#FDF6E6; --surface2:#F8EBD1;
  --green:#6A7A2E; --green-d:#515E1E; --green-t:rgba(106,122,46,.16);
  --kraft-t:rgba(232,160,90,.26); --season-dot:#E8913A;
}
/* winter: oat, chestnut, pine */
:root[data-season="winter"]{
  --bg:#EEE7DA; --bg2:#E0D5C3; --surface:#FAF6EE; --surface2:#F2ECE0;
  --green:#4D6646; --green-d:#384D33; --green-t:rgba(77,102,70,.16);
  --kraft-t:rgba(150,105,75,.22); --season-dot:#8A5A3B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-season="spring"]{
    --bg:#1A1B13; --bg2:#121309; --surface:#272A1C; --surface2:#212318;
    --green:#A5C77A; --green-d:#BFDA98; --green-t:rgba(165,199,122,.18);
    --kraft-t:rgba(130,150,90,.26); --season-dot:#E5737B;
  }
  :root:not([data-theme="light"])[data-season="summer"]{
    --bg:#201810; --bg2:#160F08; --surface:#30241A; --surface2:#281E15;
    --green:#B5C26C; --green-d:#CBD68A; --green-t:rgba(181,194,108,.18);
    --kraft-t:rgba(190,125,70,.28); --season-dot:#F0A55C;
  }
  :root:not([data-theme="light"])[data-season="winter"]{
    --bg:#1B1714; --bg2:#120F0C; --surface:#29231F; --surface2:#221D19;
    --green:#9DB894; --green-d:#B8CFB0; --green-t:rgba(157,184,148,.18);
    --kraft-t:rgba(140,100,75,.28); --season-dot:#C08A66;
  }
}
:root[data-theme="dark"][data-season="spring"]{
  --bg:#1A1B13; --bg2:#121309; --surface:#272A1C; --surface2:#212318;
  --green:#A5C77A; --green-d:#BFDA98; --green-t:rgba(165,199,122,.18);
  --kraft-t:rgba(130,150,90,.26); --season-dot:#E5737B;
}
:root[data-theme="dark"][data-season="summer"]{
  --bg:#201810; --bg2:#160F08; --surface:#30241A; --surface2:#281E15;
  --green:#B5C26C; --green-d:#CBD68A; --green-t:rgba(181,194,108,.18);
  --kraft-t:rgba(190,125,70,.28); --season-dot:#F0A55C;
}
:root[data-theme="dark"][data-season="winter"]{
  --bg:#1B1714; --bg2:#120F0C; --surface:#29231F; --surface2:#221D19;
  --green:#9DB894; --green-d:#B8CFB0; --green-t:rgba(157,184,148,.18);
  --kraft-t:rgba(140,100,75,.28); --season-dot:#C08A66;
}
body,.app,.phone,.tabbar,.seasonbox,.sheet{transition:background-color .45s ease}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stage + phone */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px}
.side{display:none}
.phone{position:relative;width:100%;height:100%;background:var(--bg)}
@media (min-width:760px) and (min-height:620px){
  body{background:var(--bg2)}
  .stage{padding:18px}
  .phone{width:404px;max-width:100%;height:min(868px,100%);border-radius:48px;border:9px solid #2B2017;box-shadow:0 40px 80px -30px rgba(40,25,10,.55);overflow:hidden}
}
@media (min-width:1080px) and (min-height:620px){
  .side{display:block;width:340px}
  .side h2{font-family:var(--display);font-size:44px;line-height:1.05;font-weight:400;letter-spacing:-.01em}
  .side p{margin-top:14px;color:var(--ink2);max-width:32ch}
  .side ul{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}
  .side li button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:600}
  .side li button:hover{background:var(--surface2)}
  .side small{display:block;margin-top:22px;color:var(--ink2);font-size:12.5px;max-width:34ch}
}
.app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:23px;letter-spacing:-.01em}
.brand svg{width:34px;height:22px}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:13px}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--season-dot);transition:background-color .45s ease}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.iconbtn svg{width:21px;height:21px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--green);color:var(--on-green);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.badge[hidden]{display:none}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 28px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.view{display:none}
.view.on{display:block}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 10px 10px;background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:16px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{background:var(--green-t);color:var(--green-d)}

/* type */
.display{font-family:var(--display);font-weight:400;letter-spacing:-.012em}
h1.display{font-size:33px;line-height:1.08}
h2.display{font-size:25px;line-height:1.12}
h3.display{font-size:19px;line-height:1.2}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;background:var(--green);color:var(--on-green);transition:transform .12s ease,background .12s}
.btn:hover{background:var(--green-d);color:var(--on-green)}
.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 15px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* home */
.hero{padding-top:6px}
.hero p{margin-top:10px;color:var(--ink2);max-width:34ch}
.shot{position:relative;margin-top:18px;border-radius:30px;background:#FBF6EA;overflow:hidden;box-shadow:var(--shadow)}
.shot img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
.tag{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;border-radius:999px;background:rgba(251,247,233,.92);color:#3A2A1D;font-size:11.5px;font-weight:700;box-shadow:0 2px 8px rgba(58,42,29,.25);white-space:nowrap}
.features{display:grid;gap:12px;margin-top:18px}
.feat{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);transition:transform .12s}
.feat:active{transform:scale(.99)}
.feat .ico{flex:none;width:58px;height:58px;border-radius:19px;display:grid;place-items:center}
.feat .ico svg{width:30px;height:30px}
.feat h3{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.15}
.feat p{font-size:13.5px;color:var(--ink2);margin-top:3px}
.feat .chev{margin-left:auto;width:20px;height:20px;color:var(--ink2);flex:none}
.sect{margin-top:30px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.step{text-align:center}
.step .im{aspect-ratio:1/1.1;border-radius:18px;background:#FBF6EA;overflow:hidden;display:grid;place-items:center}
.step img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.step b{display:block;margin-top:8px;font-size:13.5px;line-height:1.2}
.step span{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.seasonbox{margin-top:30px;padding:16px;border-radius:24px;background:var(--kraft-t)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:13.5px;transition:background .12s,color .12s}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"],.chip.on{background:var(--green);color:var(--on-green);box-shadow:none}
.chip.lock{opacity:.5}
.foot{margin-top:26px;font-size:12px;color:var(--ink2)}

/* forms */
.panel{margin-top:16px;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--bg2)}
.seg button{padding:9px 6px;border-radius:999px;text-align:center;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(58,42,29,.22)}
.field{margin-top:16px}
.field label,.field .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;margin-bottom:7px}
.field output{font-family:var(--display);font-size:20px;font-weight:400}
input[type=range]{width:100%;accent-color:var(--green);height:28px;margin:0}
select,textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{resize:none;min-height:96px}

/* calculator result */
.big{display:flex;align-items:baseline;gap:8px}
.big .n{font-family:var(--display);font-size:56px;line-height:1;letter-spacing:-.02em}
.tray{display:flex;gap:2px;border-radius:14px;overflow:hidden;background:var(--line)}
.tray i{display:block;min-width:2px}
.legend{display:grid;gap:7px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend i{width:11px;height:11px;border-radius:4px;flex:none}
.legend span:last-child{margin-left:auto;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv div{padding:11px 12px;border-radius:16px;background:var(--bg)}
.kv b{display:block;font-family:var(--display);font-size:20px;font-weight:400}
.note{margin-top:12px;padding:11px 13px;border-radius:14px;background:var(--green-t);font-size:13.5px}
.note.warn{background:var(--almond-t)}

/* craft */
.presets{display:flex;gap:10px;overflow-x:auto;margin:12px -18px 0;padding:2px 18px 8px;scroll-snap-type:x proximity}
.preset{flex:none;width:176px;padding:13px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);scroll-snap-align:start;transition:box-shadow .12s}
.preset b{display:block;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15}
.preset span{display:block;margin-top:5px;font-size:12.5px;color:var(--ink2)}
.preset[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--green);background:var(--green-t)}
.groupname{margin-top:18px;font-weight:700;font-size:13.5px}
.cream-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cream-opt{padding:11px 12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:600;line-height:1.25}
.cream-opt small{display:block;font-weight:500;color:var(--ink2);font-size:12px;margin-top:2px}
.cream-opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--green);background:var(--green-t)}
.toggles{display:grid;gap:8px;margin-top:10px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:14px}
.tog small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--bg2);position:relative;transition:background .15s;box-shadow:inset 0 0 0 1px var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tog[aria-pressed="true"] .sw{background:var(--green)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.recipe{margin-top:22px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.recipe-head{padding:18px 16px 14px;background:var(--kraft-t)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta span{padding:4px 10px;border-radius:999px;background:var(--surface);font-size:12px;font-weight:600}
.box3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.box3 div{text-align:center;font-size:12px}
.box3 .im{aspect-ratio:1/1;border-radius:14px;background:#FBF6EA;overflow:hidden}
.box3 img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.box3 b{display:block;font-size:13px;margin-top:5px}
.rbody{padding:16px}
.rbody h3{margin-bottom:10px}
.ing{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .sw2{width:13px;height:13px;border-radius:5px;flex:none}
.ing .nm{flex:1;min-width:0}
.ing .nm b{display:block;font-size:14px;line-height:1.2}
.ing .nm small{display:block;font-size:12px;color:var(--ink2)}
.ing .g{text-align:right;font-weight:700;font-size:14px;line-height:1.2}
.ing .g small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.fresh{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--green-t);color:var(--green-d);font-size:11px;font-weight:700;vertical-align:1px}
.fresh.st{background:var(--almond-t);color:var(--ink2)}
.x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.x:hover{background:var(--bg2)}
.x svg{width:15px;height:15px}
.cov{margin-top:12px}
.cov-h{display:flex;justify-content:space-between;font-size:13.5px}
.cov-h span:last-child{color:var(--ink2)}
.cov-h b{color:var(--ink)}
.cov-bar{margin-top:5px;height:12px;border-radius:7px;background:var(--bg2);overflow:hidden}
.cov-bar i{display:block;height:100%;border-radius:7px;background:var(--almond-t);background:#B28660;transition:width .35s ease}
.cov.want .cov-bar i{background:var(--green)}
.cov.want .cov-h>span:first-child{font-weight:700}
.claims{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.claim{padding:5px 10px;border-radius:999px;background:var(--green);color:var(--on-green);font-size:12px;font-weight:700}
.claim.src{background:var(--green-t);color:var(--green-d)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.macros div{text-align:center;padding:9px 4px;border-radius:14px;background:var(--bg)}
.macros b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.macros span{font-size:11.5px;color:var(--ink2)}
details{margin-top:12px}
summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:6px 0}
.tips{display:grid;gap:8px;margin-top:8px}
.tips p{font-size:13.5px;padding-left:12px;border-left:3px solid var(--kraft)}
.ractions{display:flex;gap:8px;margin-top:14px}
.ractions .btn{flex:1}
.empty{padding:22px 16px;text-align:center;color:var(--ink2)}

/* community */
.challenge{margin-top:14px;padding:16px;border-radius:24px;background:var(--green);color:var(--on-green)}
.challenge p{color:inherit;opacity:.92;margin-top:6px;font-size:14px}
.sevenrow{display:flex;gap:5px;margin-top:12px}
.sevenrow i{flex:1;height:14px;border-radius:7px;background:rgba(250,246,228,.9)}
.sevenrow i:nth-child(2n){background:rgba(250,246,228,.62)}
.challenge .btn{margin-top:14px;background:var(--on-green);color:var(--green-d)}
.challenge .btn:hover{background:#fff}
.filters{display:flex;gap:7px;overflow-x:auto;margin:16px -18px 0;padding:0 18px 4px}
.filters .chip{flex:none}
.linkrow{display:flex;align-items:center;gap:8px;margin-top:14px}
.linkrow .grow{flex:1;font-size:13px;color:var(--ink2)}
.plat-mini{display:flex}
.plat-mini .pi{width:26px;height:26px;margin-left:-6px;border:2px solid var(--bg);border-radius:50%}
.plat-mini .pi:first-child{margin-left:0}
.post{margin-top:16px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}
.phead b{display:flex;align-items:center;gap:5px;font-size:14.5px;line-height:1.2}
.phead small{display:block;color:var(--ink2);font-size:12.5px}
.ver{width:15px;height:15px;border-radius:50%;background:var(--green);color:var(--on-green);display:inline-grid;place-items:center}
.ver svg{width:10px;height:10px}
.ptext{margin-top:10px;white-space:pre-wrap;word-wrap:break-word}
.ptags{margin-top:6px;color:var(--green-d);font-weight:600;font-size:13.5px}
.pphoto{margin-top:10px;border-radius:16px;overflow:hidden;background:var(--bg2)}
.pphoto img{display:block;width:100%;max-height:300px;object-fit:cover}
.mini{margin-top:10px;padding:12px;border-radius:16px;background:var(--bg)}
.mini b{font-family:var(--display);font-weight:400;font-size:16px}
.mini .tray{margin-top:8px}
.mini small{display:block;margin-top:7px;color:var(--ink2);font-size:12.5px}
.pbar{display:flex;align-items:center;gap:4px;margin-top:10px}
.pbar button{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.pbar button svg{width:20px;height:20px}
.pbar button:hover{background:var(--bg)}
.pbar .liked{color:var(--apple)}
.pbar .liked svg{fill:currentColor}
.pbar .saved{color:var(--green-d)}
.pbar .saved svg{fill:currentColor}
.pbar .sp{margin-left:auto}
.fab{position:absolute;right:18px;bottom:88px;z-index:5;width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--on-green);display:none;place-items:center;box-shadow:0 10px 22px -8px rgba(40,50,10,.6)}
.fab.on{display:grid}
.fab svg{width:26px;height:26px}

/* sheets, toast */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(30,20,10,.5);display:none;align-items:flex-end}
.scrim.on{display:flex}
.sheet{width:100%;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-b{overflow-y:auto;padding:4px 18px 22px}
.toast{position:absolute;left:50%;bottom:92px;z-index:40;transform:translate(-50%,20px);max-width:86%;padding:11px 16px;border-radius:16px;background:#2B2017;color:#F6EEDA;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.plats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin-top:14px}
.plat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-decoration:none;text-align:center;border-radius:14px;padding:4px 0}
.plat .pi{width:50px;height:50px;border-radius:16px}
.plat.sel .pi{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--green)}
.pi{display:grid;place-items:center;color:#fff}
.pi svg{width:55%;height:55%}
.cardimg{display:block;width:100%;border-radius:16px;box-shadow:var(--shadow);margin-top:12px}
.acct{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.acct:first-of-type{border-top:0}
.acct .pi{width:42px;height:42px;border-radius:14px;flex:none}
.acct b{display:block;font-size:14.5px;line-height:1.2}
.acct small{color:var(--ink2);font-size:12.5px}
.acct .btn{margin-left:auto}
.cm{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cm:first-child{border-top:0}
.cm b{margin-right:6px}
.row{display:flex;gap:8px;align-items:center}
.counter{font-size:12px;color:var(--ink2);text-align:right;margin-top:4px}
.attach{display:grid;gap:7px;margin-top:10px}
.attach button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:600;background:var(--surface)}
.attach button[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--green);background:var(--green-t)}
.attach .tray{width:54px;flex:none}
.photoprev{position:relative;margin-top:10px}
.photoprev img{width:100%;max-height:200px;object-fit:cover;border-radius:14px;display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function allocate(items, total){
  var res = items.map(function(){ return 0; }), free = items.map(function(_,i){ return i; }), remaining = total;
  for(var it=0; it<12 && free.length; it++){
    var sw = free.reduce(function(a,i){ return a+items[i].w; }, 0), clamped = false;
    free.slice().forEach(function(i){

      if(v > items[i].max){ res[i] = items[i].max; remaining -= items[i].max; free = free.filter(function(j){ return j!==i; }); clamped = true; }
    });
    if(!clamped){ var sw2 = free.reduce(function(a,i){ return a+items[i].w; }, 0); free.forEach(function(i){ res[i] = remaining*items[i].w/sw2; }); remaining = 0; break; }
  }
  return res;
}

function calcCalc(p){
  var bmr = 10*p.w + 6.25*p.h - 5*p.age + (p.sex==="m" ? 5 : -161);
  var tdee = bmr*p.act, goal = p.goal, target = tdee*(1+goal), floor = p.sex==="m" ? 1500 : 1200, clamped = false;
  if(target < floor){ target = floor; clamped = true; }
  var pkgTable = { "1.2":.9, "1.375":1, "1.55":1.2, "1.725":1.5, "1.9":1.7 };
  var pkg = (pkgTable[String(p.act)]||1) + (goal<0 ? .2 : 0) + (p.diet==="vegan" ? .1 : p.diet==="vegetarian" ? .05 : 0);
  var prot = Math.min(p.w*pkg, target*.30/4), fat = target*.28/9, carb = (target - prot*4 - fat*9)/4;
  return { bmr:bmr, tdee:tdee, target:target, clamped:clamped, prot:prot, fat:fat, carb:carb, pkg:pkg };
}

function captionFor(item){
  var tags = (item.tags && item.tags.length ? item.tags : ["MyCraftWeek","CraftBar","PlantBased"]).map(function(t){ return "#"+t; }).join(" ");
  if(item.recipe){
    var s = item.recipe, hi = (s.hi||[]).map(function(h){ return h.label+" "+h.pct+"%"; }).join(", ");
    var intro = item.text ? item.text+"\n\n" : "";
    return intro+"My "+s.name+" from CraftBar: "+s.kcal+" kcal per bar"+(hi?", "+hi+" of the daily reference":"")+". "+tags;
  }
  return item.text+" "+tags;
}
function openShare(item, selected){
  S.cur = item;
  var cap = captionFor(item);
  var body = '<div class="field" style="margin-top:4px"><label for="cap">Caption</label><textarea id="cap" maxlength="500">'+esc(cap)+'</textarea></div>'+
    '<p class="small muted" style="margin-top:8px">Instagram, TikTok and Discord don’t accept prefilled web posts, so we copy the caption and open the app. The other platforms open their own share page with your caption.</p>'+
    '<div class="plats">'+PLAT.map(function(p){ return '<a class="plat'+((selected||[]).indexOf(p.id)>=0?" sel":"")+'" href="#" data-act="plat" data-id="'+p.id+'" role="button">'+platIcon(p.id)+'<span>'+p.name+'</span></a>'; }).join("")+
      '<a class="plat" href="#" data-act="copylink" role="button"><span class="pi" style="background:#6B5744">'+ico("link")+'</span><span>Copy link</span></a>'+
      '<a class="plat" href="#" data-act="nativeshare" role="button"><span class="pi" style="background:#5B6F33">'+ico("more")+'</span><span>More</span></a></div>'+
    '<div class="row" style="margin-top:18px"><button type="button" class="btn ghost block" data-act="makecard">'+ico("camera")+'Make a story image</button></div><div id="cardOut"></div>';
  openSheet("Share", body);
}
function capText(){ var t = $("#cap"); return t ? t.value : captionFor(S.cur||{text:""}); }
function copyText(text){
  return new Promise(function(res){
    function fallback(){ var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); var ok = false; try{ ok = document.execCommand("copy"); }catch(e){} document.body.removeChild(t); res(ok); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ res(true); }, fallback); } else fallback();
  });
}
function openExternal(url){ try{ var w = window.open(url, "_blank", "noopener"); if(!w) throw 0; }catch(e){ copyText(url).then(function(){ toast("Pop-up blocked. Link copied instead."); }); } }

/* story card */
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrap(g, text, maxW){ var words = String(text).split(/\s+/), lines = [], line = ""; words.forEach(function(w){ var t = line ? line+" "+w : w; if(g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }); if(line) lines.push(line); return lines; }
async function makeCard(item){
  try{ await document.fonts.load('64px "Young Serif"'); await document.fonts.load('600 36px "Hanken Grotesk"'); }catch(e){}
  var W=1080,H=1350,c=document.createElement("canvas"); c.width=W; c.height=H; var g=c.getContext("2d");
  var serif='"Young Serif", Georgia, serif', sans='"Hanken Grotesk", system-ui, sans-serif';
  g.fillStyle="#F2EAD2"; g.fillRect(0,0,W,H);
  g.strokeStyle="#C9A474"; g.lineWidth=20; rr(g,40,40,W-80,H-80,52); g.stroke();
  g.fillStyle="#5B6F33"; g.font="56px "+serif; g.textBaseline="alphabetic"; g.fillText("CraftBar",110,150);
  var s = item.recipe;
  if(s){
    g.fillStyle="#3A2A1D"; g.font="88px "+serif; var y=270;
    wrap(g,s.name,860).slice(0,2).forEach(function(l){ g.fillText(l,110,y); y+=100; });
    g.fillStyle="#6B5744"; g.font="600 38px "+sans; g.fillText(seasonName(s.season)+" · "+s.diet+" · "+s.size+" g bar",110,y+6);
    var ty = y+60, tx=110, tw=860, th=120, x=tx;
    g.save(); rr(g,tx,ty,tw,th,60); g.clip();
    var tot = s.parts.reduce(function(a,p){ return a+p.f; },0);
    s.parts.forEach(function(p){ var w = tw*p.f/tot; g.fillStyle=p.color; g.fillRect(x,ty,w-4,th); x+=w; });
    g.restore();
    var ly = ty+th+80; g.font="600 38px "+sans;
    s.parts.slice(0,7).forEach(function(p){ g.fillStyle=p.color; rr(g,110,ly-26,28,28,9); g.fill(); g.fillStyle="#3A2A1D"; g.textAlign="left"; g.fillText(p.name,160,ly); g.textAlign="right"; g.fillText(r0(p.f*100)+"%",970,ly); g.textAlign="left"; ly+=50; });
    g.fillStyle="#3A2A1D"; g.font="700 44px "+sans; var hy = ly+28;
    g.fillText(s.kcal+" kcal per bar",110,hy);
    g.font="600 36px "+sans; g.fillStyle="#44541F";
    var hl = (s.hi||[]).map(function(h){ return h.label+" "+h.pct+"%"; }).join(" · "); g.fillText(hl,110,hy+56);
  } else {
    g.fillStyle="#3A2A1D"; g.font="64px "+serif; var qy=300;
    wrap(g,"“"+item.text+"”",860).slice(0,9).forEach(function(l){ g.fillText(l,110,qy); qy+=84; });
    g.fillStyle="#6B5744"; g.font="600 38px "+sans; g.fillText(item.handle||"",110,qy+30);
  }
  g.fillStyle="#5B6F33"; g.font="700 38px "+sans; g.textAlign="left"; g.fillText("#MyCraftWeek  #CraftBar",110,1270);
  return new Promise(function(res){ c.toBlob(function(b){ res({ url:c.toDataURL("image/png"), blob:b }); }, "image/png"); });
}

/* compose */
var draft = { text:"", recipe:null, recIdx:-1, photo:null, tags:[], targets:[] };
function openCompose(tag){
  draft = { text:"", recipe:null, recIdx:-1, photo:null, tags: tag?[tag]:[], targets: S.auto ? Object.keys(S.links).filter(function(k){ return S.links[k]; }) : [] };
  var r = curRecipe(), hasRec = !r.error;
  var recs = []; if(hasRec) recs.push({ label:"Current recipe: "+r.name, snap:snapshot(r) }); S.box.forEach(function(s){ recs.push({ label:"In my box: "+s.name, snap:s }); });
  S._recs = recs;
  var body =
    '<div class="field" style="margin-top:4px"><label for="ptxt">Your post<span class="tiny muted" id="pcount" style="font-weight:500">0 / 280</span></label><textarea id="ptxt" data-in="ptxt" maxlength="280" placeholder="What did you mix this week?"></textarea></div>'+
    '<div class="chips" id="tagchips">'+["MyCraftWeek","VeganGaps","CraftBar","PlantBased","SeasonalEating"].map(function(t){ return '<button type="button" class="chip" data-act="tagtog" data-t="'+t+'" aria-pressed="'+(draft.tags.indexOf(t)>=0)+'">#'+t+'</button>'; }).join("")+'</div>'+
    '<div class="groupname">Attach a recipe</div><div class="attach" id="attach">'+attachHTML()+'</div>'+
    '<div class="groupname">Photo</div><div class="row" style="margin-top:8px"><label class="btn ghost sm" for="photo" style="cursor:pointer">'+ico("camera")+'Add a photo</label><input type="file" id="photo" accept="image/*" class="sr" data-in="photo"></div><div id="photoPrev"></div>'+
    '<div class="groupname">Also share to</div><div class="chips" id="tgts">'+targetsHTML()+'</div>'+
    '<p class="tiny muted" style="margin-top:8px">After you post, we open each platform’s share step with your caption ready.</p>'+
    '<button type="button" class="btn block" style="margin-top:18px" data-act="publish" id="pubBtn" disabled>Post</button>';
  openSheet("New post", body, function(){ var t = $("#ptxt"); if(t) t.focus(); });
}
function attachHTML(){
  var recs = S._recs||[];
  return '<button type="button" data-act="attachrec" data-i="-1" aria-pressed="'+(draft.recIdx===-1)+'"><span>No recipe</span></button>'+recs.map(function(x,i){ var on = draft.recIdx===i; return '<button type="button" data-act="attachrec" data-i="'+i+'" aria-pressed="'+!!on+'">'+trayBar(x.snap.parts,14)+'<span>'+esc(x.label)+'</span></button>'; }).join("");
}
function targetsHTML(){ return CONNECTABLE.map(function(id){ var p = platById(id), on = draft.targets.indexOf(id)>=0; return '<button type="button" class="chip" data-act="tgt" data-id="'+id+'" aria-pressed="'+on+'">'+p.name+(S.links[id]?"":" (not linked)")+'</button>'; }).join(""); }
function refreshPub(){ var b = $("#pubBtn"); if(b) b.disabled = !(draft.text.trim() || draft.recipe); }

function linksSheet(){
  var body = '<p class="muted small">Link your accounts so a CraftBar post can go to your socials in one tap. This demo simulates the sign-in step.</p><div style="margin-top:8px">'+
    CONNECTABLE.map(function(id){ var p = platById(id), on = !!S.links[id]; return '<div class="acct">'+platIcon(id)+'<span><b>'+p.name+'</b><small>'+(on?"Linked as "+esc(S.links[id]):"Not linked")+'</small></span><button type="button" class="btn sm '+(on?"ghost":"")+'" data-act="linktog" data-id="'+id+'">'+(on?"Unlink":"Link")+'</button></div>'; }).join("")+'</div>'+
    '<button type="button" class="tog" style="margin-top:14px;width:100%" data-act="autotog" aria-pressed="'+S.auto+'"><span>Offer to share every new post<small>Linked platforms are preselected</small></span><span class="sw"></span></button>'+
    '<p class="tiny muted" style="margin-top:12px">In the live app, each link uses that platform’s official login and posting permission. You can unlink at any time.</p>';
  openSheet("Linked socials", body);
}
function commentsSheet(id){
  var p = allPosts().filter(function(x){ return x.id===id; })[0]; if(!p) return;
  var cm = (p.comments||[]).concat(S.extraCm[id]||[]);
  S.cur = { cmId:id };
  openSheet("Comments", '<div id="cmList">'+(cm.length ? cm.map(function(x){ return '<div class="cm"><b>'+esc(x.u)+'</b>'+esc(x.t)+'</div>'; }).join("") : '<p class="muted small">No comments yet. Be the first.</p>')+'</div>'+
    '<div class="row" style="margin-top:14px"><input type="text" id="cmIn" maxlength="140" placeholder="Add a comment" aria-label="Add a comment"><button type="button" class="btn sm" data-act="addcm">Send</button></div>');
}

/* ---------- navigation ---------- */
var TABS = { home:["Home","home"], calculator:["Calculator","calc"], craft:["Craft","craft"], community:["Community","people"] };
function go(tab){
  if(!TABS[tab]) tab = "home";
  S.tab = tab;
  $$(".view").forEach(function(v){ v.classList.toggle("on", v.id==="v-"+tab); });
  $$(".tab").forEach(function(b){ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#fab").classList.toggle("on", tab==="community");
  if(tab==="home") renderHome(); else if(tab==="calculator") renderCalc(); else if(tab==="craft") renderCraft(); else renderCommunity();
  $("#main").scrollTop = 0;
  try{ if(location.hash.slice(1)!==tab) history.replaceState(null,"","#"+tab); }catch(e){}
}
function refreshChrome(){
  $("#seasonLabel").textContent = seasonName(S.season);
  document.documentElement.setAttribute("data-season", S.season);
  var n = S.box.length, b = $("#boxCount"); b.hidden = !n; b.textContent = n;
}
function initChrome(){
  $$(".tab").forEach(function(b){ var t = TABS[b.dataset.tab]; b.innerHTML = ico(t[1])+'<span>'+t[0]+'</span>'; });
  $("#boxIcon").innerHTML = ico("box");
  $("#fab").innerHTML = ico("plus");
}

/* ---------- events ---------- */
var H_ = {
  nav:function(a){ go(a.dataset.tab); },
  season:function(){ seasonSheet(); },
  setseason:function(a){ S.season = a.dataset.id; refreshChrome(); closeSheet(); go(S.tab); toast("Season set to "+seasonName(S.season).toLowerCase()); },
  closesheet:function(){ closeSheet(); },
  openbox:function(){ boxSheet(); },
  gocraft:function(){ closeSheet(); go("craft"); },
  /* calculator */
  "c-sex":function(a){ S.calc.sex = a.dataset.v; calcTouch(); renderCalc(); },
  "c-goal":function(a){ S.calc.goal = Number(a.dataset.v); calcTouch(); renderCalc(); },
  "c-diet":function(a){ S.calc.diet = a.dataset.v; calcTouch(); renderCalc(); },
  calc2craft:function(){
    var d = S.calc.diet;
    S.craft.diet = d==="omni" ? "flexitarian" : d;
    if(d==="vegan"){ applyPreset("gap"); } else if(d==="vegetarian"){ applyPreset("veg"); }
    go("craft"); toast("Recipe tuned to your profile");
  },
  /* craft */
  preset:function(a){ applyPreset(a.dataset.id); renderCraftCtl(); renderCraftRes(); },
  "k-diet":function(a){ S.craft.diet = a.dataset.v; saveCraft(); renderCraftCtl(); renderCraftRes(); },
  "k-size":function(a){ S.craft.size = Number(a.dataset.v); saveCraft(); renderCraftCtl(); renderCraftRes(); },
  need:function(a){ var k = a.dataset.k; if(S.craft.needs.has(k)) S.craft.needs.delete(k); else S.craft.needs.add(k); S.craft.preset = null; S.craft.shuffle = 0; saveCraft(); renderCraftCtl(); renderCraftRes(); },
  cream:function(a){ var id = a.dataset.id; S.craft.cream = (S.craft.cream===id) ? null : id; saveCraft(); renderCraftCtl(); renderCraftRes(); },
  tog:function(a){ var id = a.dataset.id; S.craft[id] = !S.craft[id]; S.craft.shuffle = 0; saveCraft(); renderCraftCtl(); renderCraftRes(); },
  excl:function(a){ S.craft.excl.add(a.dataset.id); S.craft.shuffle = 0; saveCraft(); renderCraftRes(); toast("Removed "+ingById(a.dataset.id).name.toLowerCase()); },
  resetexcl:function(){ S.craft.excl = new Set(); S.craft.noTree = false; S.craft.noSeed = false; saveCraft(); renderCraftCtl(); renderCraftRes(); },
  shuffle:function(){ S.craft.shuffle++; renderCraftRes(); toast("New mix, same nutrition goals"); },
  addbox:function(){ var r = curRecipe(); if(r.error) return; var s = snapshot(r); S.box = S.box.filter(function(x){ return x.name!==s.name; }); S.box.unshift(s); store.set("box", S.box); refreshChrome(); toast("Added to your box"); },
  sharerecipe:function(){ var r = curRecipe(); if(r.error) return; openShare({ recipe:snapshot(r), text:"", tags:["MyCraftWeek","CraftBar","PlantBased"] }); },
  /* community */
  filter:function(a){ S.filter = a.dataset.v; renderCommunity(); },
  compose:function(a){ openCompose(a.dataset.tag); },
  links:function(){ linksSheet(); },
  like:function(a){ var id = a.dataset.id; S.likes[id] = !S.likes[id]; store.set("likes", S.likes); renderCommunity(); },
  save:function(a){ var id = a.dataset.id; S.saved[id] = !S.saved[id]; store.set("saved", S.saved); renderCommunity(); toast(S.saved[id] ? "Saved to your bookmarks" : "Removed from bookmarks"); },
  comments:function(a){ commentsSheet(a.dataset.id); },
  addcm:function(){ var i = $("#cmIn"); if(!i || !i.value.trim()) return; var id = S.cur.cmId; (S.extraCm[id] = S.extraCm[id]||[]).push({ u:"You", t:i.value.trim() }); store.set("cm", S.extraCm); commentsSheet(id); renderCommunity(); },
  sharepost:function(a){ var p = allPosts().filter(function(x){ return x.id===a.dataset.id; })[0]; if(p) openShare(p); },
  sharebox:function(a){ var s = S.box[Number(a.dataset.i)]; if(s){ closeSheet(); openShare({ recipe:s, text:"", tags:["MyCraftWeek","CraftBar"] }); } },
  rmbox:function(a){ S.box.splice(Number(a.dataset.i),1); store.set("box", S.box); refreshChrome(); boxSheet(); },
  order:function(){ toast("Demo only: checkout isn’t connected yet"); },
  /* share */
  plat:function(a, e){
    e.preventDefault();
    var p = platById(a.dataset.id), cap = capText(), url = shareURL();
    if(p.kind==="url"){ openExternal(p.url(cap, url)); }
    else { copyText(cap+" "+url).then(function(ok){ toast(ok ? p.hint : "Select the caption above and copy it."); if(ok) setTimeout(function(){ openExternal(p.url); }, 350); }); }
  },
  copylink:function(a,e){ e.preventDefault(); copyText(capText()+" "+shareURL()).then(function(ok){ toast(ok ? "Caption and link copied" : "Couldn’t copy. Select the caption above."); }); },
  nativeshare:function(a,e){ e.preventDefault(); if(navigator.share){ navigator.share({ text:capText(), url:shareURL() }).catch(function(){}); } else { copyText(capText()+" "+shareURL()).then(function(){ toast("Sharing menu not available here. Caption copied."); }); } },
  makecard:function(){
    var out = $("#cardOut"); out.innerHTML = '<p class="small muted" style="margin-top:12px">Drawing your image…</p>';
    makeCard(S.cur).then(function(card){
      window._card = card;
      out.innerHTML = '<img class="cardimg" src="'+card.url+'" alt="Story image for your recipe"><div class="row" style="margin-top:12px"><button type="button" class="btn block" data-act="savecard">Save image</button></div><p class="tiny muted" style="margin-top:8px">Post it as an Instagram or TikTok story. You can also press and hold the image to save it.</p>';
    });
  },
  savecard:function(){
    var done = function(){ toast("Press and hold the image to save it."); };
    try{
      if(!window.claude || !window.claude.use) return done();
      window.claude.use("downloads").then(function(d){
        if(!d) return done();
        return d.save({ filename:"craftbar-story.png", data:window._card.blob }).then(function(){ toast("Saved"); }, function(err){ if(err && err.code==="declined") return; done(); });
      }, done);
    }catch(e){ done(); }
  },
  /* compose */
  tagtog:function(a){ var t = a.dataset.t, i = draft.tags.indexOf(t); if(i>=0) draft.tags.splice(i,1); else draft.tags.push(t); a.setAttribute("aria-pressed", String(i<0)); },
  attachrec:function(a){ var i = Number(a.dataset.i); draft.recipe = i<0 ? null : S._recs[i].snap; draft.recIdx = i; $("#attach").innerHTML = attachHTML(); refreshPub(); },
  tgt:function(a){ var id = a.dataset.id, i = draft.targets.indexOf(id); if(i>=0) draft.targets.splice(i,1); else draft.targets.push(id); $("#tgts").innerHTML = targetsHTML(); },
  publish:function(){
    var post = { id:"u"+Date.now(), user:"You", handle:"@you", flag:"", emoji:"🥜", bg:"#C9A474", time:"now", likes:0, text:draft.text.trim(), tags:draft.tags.slice(), recipe:draft.recipe, photo:draft.photo, comments:[], mine:true };
    S.myPosts.unshift(post);
    store.set("posts", S.myPosts.slice(0,12));
    var tg = draft.targets.slice();
    S.filter = "all"; closeSheet(); renderCommunity(); $("#main").scrollTop = 0;
    if(tg.length){ openShare(post, tg); toast("Posted. Finish sharing to your socials."); } else toast("Posted to the community");
  },
  linktog:function(a){
    var id = a.dataset.id;
    if(S.links[id]){ delete S.links[id]; store.set("links", S.links); linksSheet(); renderCommunity(); return; }
    a.textContent = "Linking…"; a.disabled = true;
    setTimeout(function(){ S.links[id] = "@yourname"; store.set("links", S.links); linksSheet(); renderCommunity(); toast(platById(id).name+" linked (demo)"); }, 700);
  },
  autotog:function(){ S.auto = !S.auto; store.set("auto", S.auto); linksSheet(); }
};
function calcTouch(){ S.calc.touched = true; store.set("calc", S.calc); }
function applyPreset(id){
  var p = PRESETS.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  S.craft.preset = id; S.craft.needs = new Set(p.needs); S.craft.diet = p.diet; S.craft.shuffle = 0; saveCraft();
}

document.addEventListener("click", function(e){
  var a = e.target.closest("[data-act]"); if(!a) return;
  var fn = H_[a.dataset.act]; if(fn){ fn(a, e); }
});
document.addEventListener("input", function(e){
  var el = e.target, k = el.dataset && el.dataset.in; if(!k) return;
  if(["age","h","w"].indexOf(k)>=0){ S.calc[k] = Number(el.value); $("#o-"+k).textContent = el.value+" "+el.dataset.unit; calcTouch(); updateCalc(); }
  else if(k==="ptxt"){ draft.text = el.value; $("#pcount").textContent = el.value.length+" / 280"; refreshPub(); }
});
document.addEventListener("change", function(e){
  var el = e.target, k = el.dataset && el.dataset.in; if(!k) return;
  if(k==="act"){ S.calc.act = Number(el.value); calcTouch(); updateCalc(); }
  else if(k==="photo" && el.files && el.files[0]){
    var rd = new FileReader();
    rd.onload = function(){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(1, 720/Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        draft.photo = cv.toDataURL("image/jpeg", .78);
        $("#photoPrev").innerHTML = '<div class="photoprev"><img src="'+draft.photo+'" alt="Your photo preview"></div>';
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(el.files[0]);
  }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && $("#scrim").classList.contains("on")) closeSheet();
});
$("#scrim").addEventListener("click", function(e){ if(e.target.id==="scrim") closeSheet(); });
window.addEventListener("hashchange", function(){ var t = location.hash.slice(1); if(TABS[t] && t!==S.tab) go(t); });

/* ---------- boot ---------- */
initChrome(); refreshChrome();
var startTab = (function(){ try{ var t = location.hash.slice(1); return TABS[t] ? t : "home"; }catch(e){ return "home"; } })();
go(startTab);
</script>
